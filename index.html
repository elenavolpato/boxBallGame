<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balls in the Boxes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e0e8f0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh; /* Fallback for older browsers */
            height: 100dvh; /* Dynamic viewport height - accounts for browser UI */
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh; /* Fallback for older browsers */
            height: 100dvh; /* Dynamic viewport height - accounts for browser UI */
            overflow: hidden;
        }
        
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #gameUI {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            color: #333;
            z-index: 10;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            color: #333;
            text-align: center;
            font-size: 14px;
            z-index: 10;
        }
        
        .win-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 20;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 2px solid #4CAF50;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        
        button:hover {
            background: #45a049;
        }
        
        /* Debug color controls - To enable: change 'none' to 'block' */
        #colorDebugPanel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            z-index: 30;
            font-size: 12px;
            display: none; /* Hidden - change to 'block' to enable color debugging */
        }
        
        .color-control {
            margin-bottom: 8px;
        }
        
        .color-control label {
            display: block;
            margin-bottom: 2px;
            font-weight: bold;
        }
        
        .color-control input[type="color"] {
            width: 50px;
            height: 30px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="gameUI">
        </div>
        
        <!-- Debug color controls -->
        <div id="colorDebugPanel">
            <div class="color-control">
                <label for="color1">Start Color:</label>
                <input type="color" id="color1" value="#99c1f1">
            </div>
            <div class="color-control">
                <label for="color2">Mid Color:</label>
                <input type="color" id="color2" value="#62a0ea">
            </div>
            <div class="color-control">
                <label for="color3">End Color:</label>
                <input type="color" id="color3" value="#1a5fb4">
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="winScreen" class="win-screen">
            <h2>You Win!</h2>
            <p>All balls are in their correct boxes!</p>
            <button onclick="nextTurn()">Next Turn</button>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.18.0/matter.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
