<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balls in the Boxes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e0e8f0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh; /* Fallback for older browsers */
            height: 100dvh; /* Dynamic viewport height - accounts for browser UI */
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh; /* Fallback for older browsers */
            height: 100dvh; /* Dynamic viewport height - accounts for browser UI */
            overflow: hidden;
        }
        
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #gameUI {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        
        #switchButton {
            background: #2196F3;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        
        #switchButton:hover {
            background: #1976D2;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            color: #333;
            text-align: center;
            font-size: 14px;
            z-index: 10;
        }
        
        .win-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 20;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 2px solid #4CAF50;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="gameUI">
            <div>
                <div id="score">Score: 0</div>
                <div id="level">Level: 1</div>
                <div id="turn">Turn: 1</div>
            </div>
            <button id="switchButton" onclick="toggleFixedObjects()">Switch: Boxes Fixed</button>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="winScreen" class="win-screen">
            <h2>You Win!</h2>
            <p>All balls are in their correct boxes!</p>
            <button onclick="nextTurn()">Next Turn</button>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.18.0/matter.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
